services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      # Internal container paths - not user-configurable via .env. Back up
      # the whole bind-mounted ./data directory to back up the database and
      # feedback attachments together (see docs/deployment.md).
      FREEZEFLOW_DATABASE_URL: sqlite:////data/freezeflow.db
      FREEZEFLOW_FEEDBACK_UPLOAD_DIR: /data/uploads/feedback
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Empty on purpose: nginx.conf proxies /api/ to the backend service
        # on the same origin, so the frontend never needs to know its own
        # public host/port at build time.
        VITE_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
