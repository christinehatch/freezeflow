[project]
name = "freezeflow-backend"
version = "0.1.0"
description = "Freezeflow backend API"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.9.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

# Not installed by default (see ADR-0021 and docs/deployment.md): Freezeflow
# is a single-operator home tool, and defaults to SQLite so a self-hosted
# deployment has one file to back up rather than a second database service
# to run and secure. Install this group only when pointing
# FREEZEFLOW_DATABASE_URL at a real Postgres server.
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

