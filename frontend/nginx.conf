server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gates the whole origin (static assets, the SPA, and /api/ below) behind
    # a single shared username/password - most useful when the app is
    # reachable from the public internet (e.g. via `tailscale funnel`)
    # rather than tailnet-only (`tailscale serve`), but applied
    # unconditionally to keep this file simple. nginx requires
    # auth_basic_user_file to exist just to start, so docs/deployment.md's
    # setup order creates it before the first `docker compose up`.
    auth_basic "Freezeflow";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Feedback attachments (ADR-0020) are validated against a 10 MB limit
    # in the backend (backend/app/services/feedback.py); nginx's own 1 MB
    # default would otherwise reject them with a 413 before the backend
    # ever sees the request. A little headroom above 10 MB covers
    # multipart/form-data overhead.
    client_max_body_size 11m;

    # Exempted from auth_basic so external uptime monitors can check it
    # without real credentials - "is the server up" isn't sensitive, and
    # this is a standard pattern for health/status endpoints.
    location = /api/v1/health {
        auth_basic off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # react-router client-side routing: serve index.html for any path that
    # isn't a real static file, and let the SPA's router take over.
    location / {
        try_files $uri /index.html;
    }
}
