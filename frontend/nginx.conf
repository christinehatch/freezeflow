server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Feedback attachments (ADR-0020) are validated against a 10 MB limit
    # in the backend (backend/app/services/feedback.py); nginx's own 1 MB
    # default would otherwise reject them with a 413 before the backend
    # ever sees the request. A little headroom above 10 MB covers
    # multipart/form-data overhead.
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # react-router client-side routing: serve index.html for any path that
    # isn't a real static file, and let the SPA's router take over.
    location / {
        try_files $uri /index.html;
    }
}
